name: CI

# Tests and formatting on every pull request and on master. GitHub-hosted on purpose:
# a public repository must never run outside contributions on a self-hosted runner.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: ./mvnw -B verify
