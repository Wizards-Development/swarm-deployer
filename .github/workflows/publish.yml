name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version / tag à publier"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: Wizards-Development/shared-workflows/.github/workflows/maven-library.yml@master
    with:
      version: ${{ github.event.release.tag_name || inputs.version }}
      # Public repository: never on the self-hosted runner.
      runs-on: ubuntu-latest
